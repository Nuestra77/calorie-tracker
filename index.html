        label { display: block; font-size: 14px; margin-bottom: 0.5rem; color: #333; font-weight: 500; }

        button:hover { background: rgba(200,200,200,0.3); }

        .stat-label { font-size: 12px; color: #888; margin-top: 0.5rem; }
        .progress-bar { height: 8px; background: rgba(255,182,193,0.2); border-radius: 10px; overflow: hidden; margin-bottom: 0.5rem; }

        .progress-bar.cal .progress-fill { background: linear-gradient(90deg, rgba(255,200,124,0.7), rgba(255,180,80,1)); }

        .user-info { display: flex; justify-content: space-between; align-items: center; background: rgba(255,182,193,0.1); padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 14px; }
        .user-name { color: #333; font-weight: 500; }

<body>
    <div class="container">
        <div id="loginSection" class="login-section">
            <h1>📊 จดแคลประจำวัน</h1>
            <p>ใส่อีเมลเพื่อเริ่มจดแคล</p>
            <input type="email" id="emailInput" placeholder="example@gmail.com">
            <button onclick="loginWithEmail()" class="btn-primary" style="padding:12px;font-size:16px;">เข้าใช้งาน</button>
        </div>

        <div id="appSection" class="hidden">
            <div class="user-info">
                <span class="user-name">👤 <span id="userName"></span></span>
                <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
            </div>

            <div class="header-gradient">
                <h1>📊 จดแคลประจำวัน</h1>
                <div class="subtitle">วันนี้: <span id="currentDate"></span></div>
            </div>

            <div class="date-nav">
                <button onclick="changeDate(-1)">← วันก่อน</button>
                <button class="btn-today" onclick="goToday()">วันนี้</button>
                <button onclick="changeDate(1)">วันต่อไป →</button>
            </div>

            <div class="card">
                <label>🎯 เป้าหมาย</label>
                <div class="goal-tabs">
                    <div class="goal-tab" id="goal-lose" onclick="setGoal('lose')">ลดน้ำหนัก</div>
                    <div class="goal-tab active" id="goal-maintain" onclick="setGoal('maintain')">คงน้ำหนัก</div>
                    <div class="goal-tab" id="goal-gain" onclick="setGoal('gain')">เพิ่มกล้าม</div>
                </div>
                <label style="margin-top:0.75rem;">แคลเป้าหมาย/วัน</label>
                <input type="number" id="calGoal" value="2000" onchange="saveSettings()">
                <label>โปรตีนเป้าหมาย/วัน (g)</label>
                <input type="number" id="proteinGoal" value="120" onchange="saveSettings()">
            </div>

            <div class="stats-grid">
                <div class="stat-card calorie">
                    <div class="stat-value" id="totalCal">0</div>
                    <div class="stat-label">/ <span id="calGoalDisplay">2000</span> แคล</div>
                </div>
                <div class="stat-card protein">
                    <div class="stat-value" id="totalProtein">0</div>
                    <div class="stat-label">/ <span id="proteinGoalDisplay">120</span> g โปรตีน</div>
                </div>
            </div>

            <div class="progress-bar cal"><div class="progress-fill" id="calBar" style="width:0%"></div></div>
            <div class="progress-text" id="calText">เหลือ 2000 แคล</div>
            <div class="progress-bar"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
            <div class="progress-text" id="progressText">ยังขาด 120g โปรตีน</div>

            <div class="card">
                <label>🍽️ ค้นหาอาหาร</label>
                <input type="text" id="searchInput" placeholder="พิมพ์ชื่ออาหาร เช่น ข้าวมันไก่, ส้มตำ..." oninput="filterFoods()" style="margin-bottom:0;">
                <div class="food-list" id="foodList"></div>
                <div class="custom-link"><a onclick="showCustomFood()">+ เพิ่มอาหารที่ไม่มีในลิสต์เอง</a></div>
            </div>

            <div id="servingSizePanel" class="hidden card">
                <div class="log-name" id="selectedFoodName" style="margin-bottom:0.75rem;"></div>
                <label>📐 หน่วย</label>
                <select id="unitSelect" onchange="updatePreview()"></select>
                <label>📏 จำนวน</label>
                <input type="number" id="servingSize" value="1" min="0.5" step="0.5" oninput="updatePreview()">
                <label>🕐 เวลากินอาหาร</label>
                <input type="time" id="mealTime">
                <div class="food-info" id="previewInfo" style="margin:0.5rem 0;"></div>
                <button class="btn-primary" onclick="addFoodToToday()">➕ เพิ่มอาหาร</button>
            </div>

            <div id="customFoodPanel" class="hidden card">
                <div class="log-name" style="margin-bottom:0.75rem;">✏️ เพิ่มอาหารเอง</div>
                <label>ชื่ออาหาร</label>
                <input type="text" id="customName" placeholder="เช่น ก๋วยจั๊บญวน">
                <label>หน่วย</label>
                <input type="text" id="customUnit" placeholder="เช่น ชาม, จาน, ชิ้น">
                <label>แคลโลรี่ (ต่อ 1 หน่วย)</label>
                <input type="number" id="customCal" placeholder="เช่น 350">
                <label>โปรตีน g (ต่อ 1 หน่วย)</label>
                <input type="number" id="customProtein" placeholder="เช่น 15">
                <label>🕐 เวลากินอาหาร</label>
                <input type="time" id="customTime">
                <button class="btn-primary" onclick="addCustomFood()">➕ เพิ่มอาหาร</button>
            </div>

            <div id="foodLogPanel" class="hidden">
                <div style="margin:1rem 0 0.75rem; font-size:16px; color:#333; font-weight:500;">📋 อาหารที่กินไป</div>
                <div id="foodLogList"></div>
            </div>

            <div id="emptyState" class="empty-state">ยังไม่มีอาหารในวันนี้ เริ่มต้นด้วยการค้นหาอาหาร 🍽️</div>
        </div>
    </div>

        let currentDate = new Date().toISOString().split('T')[0];
        let foods = [];
        let selectedFood = null;
        let userEmail = null;
        let currentGoal = 'maintain';

        function loginWithEmail() {
            const email = document.getElementById('emailInput').value.trim();
            if (!email || !email.includes('@')) { alert('กรุณาใส่อีเมลที่ถูกต้อง'); return; }
            userEmail = email;
            document.getElementById('userName').textContent = email;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            loadSettings();
            loadUserData();
            init();
        }

        function logout() {
            userEmail = null; foods = [];
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('emailInput').value = '';
        }

        function uid() { return userEmail.replace(/[.#$/\[\]]/g, '_'); }

        function loadUserData() {
            const ref = database.ref('users/' + uid() + '/foods');
            ref.on('value', (snapshot) => {
                const data = snapshot.val();
                foods = data ? Object.values(data) : [];
                updateDisplay();
            });
        }

        function saveFoodToFirebase(food) {
            database.ref('users/' + uid() + '/foods/' + food.id).set(food);
        }

        function setGoal(goal) {
            currentGoal = goal;
            document.querySelectorAll('.goal-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('goal-' + goal).classList.add('active');
            // แนะนำค่า default ตามเป้าหมาย
            const calInput = document.getElementById('calGoal');
            const proteinInput = document.getElementById('proteinGoal');
            if (goal === 'lose') { calInput.value = 1500; proteinInput.value = 130; }
            else if (goal === 'gain') { calInput.value = 2500; proteinInput.value = 160; }
            else { calInput.value = 2000; proteinInput.value = 120; }
            saveSettings();
            updateDisplay();
        }

        function saveSettings() {
            const settings = {
                goal: currentGoal,
                calGoal: document.getElementById('calGoal').value,
                proteinGoal: document.getElementById('proteinGoal').value
            };
            database.ref('users/' + uid() + '/settings').set(settings);
            updateDisplay();
        }

        function loadSettings() {
            database.ref('users/' + uid() + '/settings').once('value', (snap) => {
                const s = snap.val();
                if (s) {
                    currentGoal = s.goal || 'maintain';
                    document.getElementById('calGoal').value = s.calGoal || 2000;
                    document.getElementById('proteinGoal').value = s.proteinGoal || 120;
                    document.querySelectorAll('.goal-tab').forEach(t => t.classList.remove('active'));
                    document.getElementById('goal-' + currentGoal).classList.add('active');
                    updateDisplay();
                }
            });
        }

        function updateDisplay() {
            let todayFoods = foods.filter(f => f.date === currentDate);
            todayFoods.sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));
            const totalCal = todayFoods.reduce((s, f) => s + f.totalCal, 0);
            const totalProtein = Math.round(todayFoods.reduce((s, f) => s + f.totalProtein, 0) * 10) / 10;
            const calGoal = parseInt(document.getElementById('calGoal').value);
            const goal = parseInt(document.getElementById('proteinGoal').value);
            const calPercent = Math.min(100, Math.round((totalCal / calGoal) * 100));
            const percent = Math.min(100, Math.round((totalProtein / goal) * 100));

            document.getElementById('totalCal').textContent = totalCal;
            document.getElementById('totalProtein').textContent = totalProtein;
            document.getElementById('calGoalDisplay').textContent = calGoal;
            document.getElementById('proteinGoalDisplay').textContent = goal;
            document.getElementById('calBar').style.width = calPercent + '%';
            document.getElementById('progressBar').style.width = percent + '%';
            const calLeft = calGoal - totalCal;
            document.getElementById('calText').textContent = calLeft >= 0 ? ('เหลือ ' + calLeft + ' แคล') : ('เกิน ' + Math.abs(calLeft) + ' แคล ⚠️');
            document.getElementById('progressText').textContent = totalProtein >= goal ? '✅ ครบเป้าหมายโปรตีน!' : ('ยังขาด ' + (Math.round((goal - totalProtein)*10)/10) + 'g โปรตีน');

            const logList = document.getElementById('foodLogList');
            const logPanel = document.getElementById('foodLogPanel');
            const emptyState = document.getElementById('emptyState');
            if (todayFoods.length > 0) {
                logPanel.classList.remove('hidden');
                emptyState.classList.add('hidden');
                logList.innerHTML = todayFoods.map(f =>
                    '<div class="log-item"><div>' +
                    '<div class="log-name">' + f.foodName + '</div>' +
                    '<div class="log-qty">' + f.quantity + ' ' + f.unit + ' <span style="color:#ff69b4;font-weight:500;">🕐 ' + f.time + '</span></div>' +
                    '<div class="log-nutrition">' + f.totalCal + ' cal | ' + f.totalProtein + 'g protein</div>' +
                    '</div><button class="btn-delete" onclick="removeFood(\'' + f.id + '\')">ลบ</button></div>'
                ).join('');
            } else {
                logPanel.classList.add('hidden');
                emptyState.classList.remove('hidden');
            }
        }

        function updateDate() {
            const date = new Date(currentDate + 'T00:00:00');
            document.getElementById('currentDate').textContent = date.toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });
        }
        function changeDate(days) {
            const date = new Date(currentDate + 'T00:00:00');
            date.setDate(date.getDate() + days);
            currentDate = date.toISOString().split('T')[0];
            updateDate(); updateDisplay();
        }
        function goToday() { currentDate = new Date().toISOString().split('T')[0]; updateDate(); updateDisplay(); }

        function filterFoods() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('foodList');
            document.getElementById('servingSizePanel').classList.add('hidden');
            document.getElementById('customFoodPanel').classList.add('hidden');
            if (!search) { list.innerHTML = ''; return; }
            const filtered = foodDatabase.filter(f => f.name.toLowerCase().includes(search) || f.cat.toLowerCase().includes(search));
            list.innerHTML = filtered.slice(0, 15).map(f => {
                const u = f.units[0];
                return '<div class="food-item" onclick="selectFood(\'' + f.name.replace(/'/g,"\\'") + '\')">' +
                    '<div class="food-name">' + f.name + '<span class="food-cat">' + f.cat + '</span></div>' +
                    '<div class="food-info">' + u.cal + ' cal | ' + u.protein + 'g โปรตีน / ' + u.u + '</div></div>';
            }).join('');
            if (filtered.length === 0) list.innerHTML = '<div class="food-info" style="padding:0.5rem;">ไม่พบอาหารนี้ ลองเพิ่มเองด้านล่าง</div>';
        }

        function selectFood(name) {
            selectedFood = foodDatabase.find(f => f.name === name);
            document.getElementById('selectedFoodName').textContent = '🍽️ ' + name;
            const unitSelect = document.getElementById('unitSelect');
            unitSelect.innerHTML = selectedFood.units.map((u, i) => '<option value="' + i + '">' + u.u + ' (' + u.cal + ' cal, ' + u.protein + 'g)</option>').join('');
            document.getElementById('servingSize').value = 1;
            const now = new Date();
            document.getElementById('mealTime').value = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            document.getElementById('foodList').innerHTML = '';
            document.getElementById('searchInput').value = name;
            document.getElementById('servingSizePanel').classList.remove('hidden');
            updatePreview();
        }

        function updatePreview() {
            if (!selectedFood) return;
            const unitIdx = parseInt(document.getElementById('unitSelect').value);
            const qty = parseFloat(document.getElementById('servingSize').value) || 0;
            const u = selectedFood.units[unitIdx];
            const cal = Math.round(u.cal * qty);
            const protein = Math.round(u.protein * qty * 10) / 10;
            document.getElementById('previewInfo').textContent = 'รวม: ' + cal + ' cal | ' + protein + 'g protein';
        }

        function addFoodToToday() {
            if (!selectedFood) return;
            const unitIdx = parseInt(document.getElementById('unitSelect').value);
            const qty = parseFloat(document.getElementById('servingSize').value);
            const u = selectedFood.units[unitIdx];
            const mealTime = document.getElementById('mealTime').value || new Date().toTimeString().slice(0,5);
            const food = {
                id: Date.now().toString(),
                foodName: selectedFood.name,
                unit: u.u,
                quantity: qty,
                totalCal: Math.round(u.cal * qty),
                totalProtein: Math.round(u.protein * qty * 10) / 10,
                time: mealTime,
                date: currentDate
            };
            saveFoodToFirebase(food);
            document.getElementById('searchInput').value = '';
            document.getElementById('servingSizePanel').classList.add('hidden');
            selectedFood = null;
        }

        function showCustomFood() {
            document.getElementById('foodList').innerHTML = '';
            document.getElementById('servingSizePanel').classList.add('hidden');
            const now = new Date();
            document.getElementById('customTime').value = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            document.getElementById('customFoodPanel').classList.remove('hidden');
        }

        function addCustomFood() {
            const name = document.getElementById('customName').value.trim();
            const unit = document.getElementById('customUnit').value.trim() || 'จาน';
            const cal = parseFloat(document.getElementById('customCal').value);
            const protein = parseFloat(document.getElementById('customProtein').value) || 0;
            if (!name || isNaN(cal)) { alert('กรุณาใส่ชื่อและแคลโลรี่'); return; }
            const mealTime = document.getElementById('customTime').value || new Date().toTimeString().slice(0,5);
            const food = {
                id: Date.now().toString(),
                foodName: name, unit: unit, quantity: 1,
                totalCal: Math.round(cal), totalProtein: Math.round(protein*10)/10,
                time: mealTime, date: currentDate
            };
            saveFoodToFirebase(food);
            document.getElementById('customName').value = '';
            document.getElementById('customUnit').value = '';
            document.getElementById('customCal').value = '';
            document.getElementById('customProtein').value = '';
            document.getElementById('customFoodPanel').classList.add('hidden');
        }

        function removeFood(id) {
            database.ref('users/' + uid() + '/foods/' + id).remove();
        }

        function init() { updateDate(); updateDisplay(); }
    </script>
