<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 จดแคลประจำวัน</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #e0f2f1 100%);
            min-height: 100vh;
            padding: 1rem;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        
        .login-section {
            text-align: center;
            padding: 2rem;
        }
        
        .login-section h1 {
            font-size: 28px;
            margin-bottom: 1rem;
            color: #333;
        }
        
        .login-section p {
            color: #888;
            margin-bottom: 2rem;
        }
        
        #g_id_onload {
            display: flex;
            justify-content: center;
        }
        
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 1rem;
        }
        
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,182,193,0.1);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 14px;
        }
        
        .user-name {
            color: #333;
            font-weight: 500;
        }
        
        .btn-logout {
            background: rgba(255,100,100,0.2);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            color: #c00;
            font-size: 12px;
            font-weight: 500;
        }
        
        .btn-logout:hover {
            background: rgba(255,100,100,0.3);
        }
        
        .header-gradient {
            background: linear-gradient(135deg, rgba(255,182,193,0.3), rgba(176,224,230,0.3));
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .card {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,182,193,0.5);
        }
        
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            margin-bottom: 0.5rem;
            font-family: inherit;
        }
        
        input[type="time"] {
            background-color: rgba(176,224,230,0.1);
        }
        
        button {
            padding: 0.5rem 1rem;
            background: rgba(200,200,200,0.2);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #333;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        button:hover {
            background: rgba(200,200,200,0.3);
        }
        
        .date-nav {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }
        
        .btn-today {
            background: rgba(255,182,193,0.3);
        }
        
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, rgba(255,192,203,0.6), rgba(255,182,193,0.6));
            margin-top: 0.5rem;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(255,192,203,0.7), rgba(255,182,193,0.7));
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .stat-card {
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .stat-card.calorie {
            background: rgba(255,200,124,0.2);
            border-color: rgba(255,200,124,0.4);
        }
        
        .stat-card.protein {
            background: rgba(255,182,193,0.2);
            border-color: rgba(255,182,193,0.4);
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 500;
            color: #333;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 0.5rem;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(255,182,193,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(255,182,193,0.7), rgba(255,182,193,1));
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .food-item {
            padding: 0.75rem;
            background: rgba(230,230,250,0.3);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            border: 1px solid rgba(230,230,250,0.5);
            transition: background 0.2s;
        }
        
        .food-item:hover {
            background: rgba(230,230,250,0.5);
        }
        
        .food-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        
        .food-info {
            font-size: 12px;
            color: #888;
        }
        
        .food-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        
        .upload-zone {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 2px dashed rgba(176,224,230,0.5);
            text-align: center;
            cursor: pointer;
        }
        
        .upload-text {
            font-size: 14px;
            color: #333;
        }
        
        .log-item {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border: 1px solid rgba(200,200,200,0.2);
        }
        
        .log-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        
        .log-qty {
            font-size: 12px;
            color: #888;
            margin-top: 0.25rem;
        }
        
        .log-nutrition {
            font-size: 12px;
            color: #888;
            margin-top: 0.5rem;
        }
        
        .btn-delete {
            background: rgba(255,200,200,0.3);
            padding: 0.5rem 0.75rem;
            font-size: 12px;
            margin-left: 1rem;
        }
        
        .btn-delete:hover {
            background: rgba(255,200,200,0.4);
        }
        
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #888;
            font-size: 14px;
        }
        
        .stats-button {
            width: 100%;
            background: linear-gradient(135deg, rgba(176,224,230,0.3), rgba(200,200,255,0.3));
            border: 1px solid rgba(176,224,230,0.5);
            margin-bottom: 1.5rem;
        }
        
        .stats-details {
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .stats-box {
            background: rgba(200,255,200,0.2);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .stats-box.full {
            grid-column: 1 / -1;
        }
        
        .food-search {
            margin-bottom: 1.5rem;
        }
        
        .search-input {
            background-color: rgba(176,224,230,0.15);
        }
        
        .export-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #ddd;
        }
        
        .btn-export {
            background: rgba(200,255,200,0.2);
            border: 1px solid rgba(200,255,200,0.4);
        }
        
        .btn-export:hover {
            background: rgba(200,255,200,0.3);
        }
        
        .hidden {
            display: none;
        }

        .sync-status {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 1rem;
        }

        .sync-ok {
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <h1>📊 จดแคลประจำวัน</h1>
            <p>เข้าสู่ระบบด้วย Google เพื่อเริ่มจดแคล</p>
            <div id="g_id_onload"
                 data-client_id="259066830160-gs126g7uj9oqo18fenhu9fjcr1auhl3d.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>

        <!-- Main App Section -->
        <div id="appSection" class="hidden">
            <div class="user-info">
                <span class="user-name">👤 <span id="userName"></span></span>
                <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
            </div>

            <div class="header-gradient">
                <h1>📊 จดแคลประจำวัน</h1>
                <div class="subtitle">วันนี้: <span id="currentDate"></span></div>
            </div>

            <div class="date-nav">
                <button onclick="changeDate(-1)">← วันก่อน</button>
                <button class="btn-today" onclick="goToday()">วันนี้</button>
                <button onclick="changeDate(1)">วันต่อไป →</button>
            </div>

            <div class="card">
                <label>🎯 เป้าหมายโปรตีนต่อวัน (g)</label>
                <input type="number" id="proteinGoal" value="120" onchange="saveProteinGoal()">
            </div>

            <div class="stats-grid">
                <div class="stat-card calorie">
                    <div class="stat-value" id="totalCal">0</div>
                    <div class="stat-label">แคลโลรี่</div>
                </div>
                <div class="stat-card protein">
                    <div class="stat-value"><span id="totalProtein">0</span> / <span id="proteinGoalDisplay">120</span></div>
                    <div class="stat-label">โปรตีน (g)</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
            <div class="progress-text" id="progressText">ยังขาด 120g โปรตีน</div>

            <button class="stats-button" onclick="toggleStats()">📈 ดูสถิติรวม</button>
            
            <div id="statsPanel" class="hidden">
                <div class="stats-details">
                    <div class="stats-box">
                        <div class="stat-value" id="totalDays">0</div>
                        <div class="stat-label">วันที่บันทึก</div>
                    </div>
                    <div class="stats-box">
                        <div class="stat-value" id="avgProtein">0</div>
                        <div class="stat-label">โปรตีนเฉลี่ย</div>
                    </div>
                    <div class="stats-box full">
                        <div class="stat-value" id="avgCalories">0</div>
                        <div class="stat-label">แคลเฉลี่ยต่อวัน</div>
                    </div>
                </div>
            </div>

            <div class="food-search">
                <label>🍽️ ค้นหาอาหาร</label>
                <input type="text" class="search-input" id="searchInput" placeholder="พิมพ์ชื่ออาหาร..." oninput="filterFoods()">
                <div class="food-list" id="foodList"></div>
            </div>

            <div id="servingSizePanel" class="hidden card">
                <label>📏 จำนวน</label>
                <input type="number" id="servingSize" value="1" min="0.5" step="0.5">
                <label>🕐 เวลากินอาหาร</label>
                <input type="time" id="mealTime">
                <button class="btn-primary" onclick="addFoodToToday()">➕ เพิ่มอาหาร</button>
            </div>

            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 24px; margin-bottom: 0.5rem;">📸</div>
                <div class="upload-text">อัพโหลดภาพอาหาร</div>
                <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload()" style="display: none;">
            </div>

            <div id="foodLogPanel" class="hidden">
                <div style="margin: 1rem 0 0.75rem; font-size: 16px; color: #333; font-weight: 500;">📋 อาหารที่กินไป</div>
                <div id="foodLogList"></div>
            </div>

            <div id="emptyState" class="empty-state">ยังไม่มีอาหารในวันนี้ เริ่มต้นด้วยการค้นหาอาหาร 🍽️</div>

            <div class="sync-status" id="syncStatus"></div>

            <div class="export-section">
                <button class="btn-export" onclick="exportData()">💾 ส่งออกข้อมูล</button>
                <button class="btn-clear" onclick="clearAllData()">🗑️ ลบข้อมูลทั้งหมด</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ ต้องแก้ไขอีก 1 อย่าง:
        const GOOGLE_CLIENT_ID = '259066830160-gs126g7uj9oqo18fenhu9fjcr1auhl3d.apps.googleusercontent.com';
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/d/13YR18bwG5TiOYxUz2W2y3LXjAoMyB2qK8XEANO0hEc31arzqeZOonHYV/userweb';

        const foodDatabase = [
            { name: 'ไก่ต้มผิวไม่หนัง', cal: 165, protein: 31, unit: '100g' },
            { name: 'ไข่ไก่ต้ม', cal: 155, protein: 13, unit: 'ฟอง' },
            { name: 'ข้าวสวย', cal: 130, protein: 2.7, unit: 'ชาม' },
            { name: 'ปลาแซลมอนย่าง', cal: 280, protein: 25, unit: '100g' },
            { name: 'ยาเนื้อแดงย่าง', cal: 250, protein: 26, unit: '100g' },
            { name: 'สลัดผักแสบ', cal: 25, protein: 1.2, unit: 'ชาม' },
            { name: 'กล้วยเหลือง', cal: 89, protein: 1.1, unit: 'ผล' },
            { name: 'นมแม่ม', cal: 61, protein: 3.2, unit: 'แก้ว' },
            { name: 'บดซาลเหลือง', cal: 180, protein: 20, unit: '100g' },
            { name: 'ข้าวโอ๊ต', cal: 390, protein: 17, unit: 'ชาม' },
            { name: 'หม้อแกงเขียว', cal: 200, protein: 15, unit: 'ชาม' },
            { name: 'ซุปมิโซะ', cal: 40, protein: 2, unit: 'ชาม' },
            { name: 'อกไก่ย่าง', cal: 165, protein: 31, unit: '100g' },
            { name: 'ข้าวกล้องคั่ว', cal: 120, protein: 2.5, unit: 'ชาม' },
            { name: 'หมูสตีก', cal: 290, protein: 25, unit: '100g' },
            { name: 'เนื้อจรุกต้ม', cal: 120, protein: 18, unit: '100g' },
            { name: 'ปลาทู่อบ', cal: 210, protein: 24, unit: '100g' },
            { name: 'ผักบุ้งลวก', cal: 20, protein: 2, unit: 'ชาม' },
            { name: 'ปลาแบ่งเค็ม', cal: 100, protein: 20, unit: '100g' },
            { name: 'ทูน่าแคน', cal: 132, protein: 29, unit: '100g' },
            { name: 'นมสด', cal: 61, protein: 3.2, unit: '200ml' },
        ];

        let currentDate = new Date().toISOString().split('T')[0];
        let foods = [];
        let selectedFood = null;
        let userEmail = null;

        // Google Login Handler
        function handleCredentialResponse(response) {
            const base64Url = response.credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map((c) => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            const userData = JSON.parse(jsonPayload);
            userEmail = userData.email;
            
            document.getElementById('userName').textContent = userData.name;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            
            loadUserData();
            init();
        }

        function logout() {
            userEmail = null;
            foods = [];
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            google.accounts.id.renderButton(
                document.querySelector('.g_id_signin'),
                { theme: 'outline', size: 'large' }
            );
        }

        function updateSyncStatus(message, isOk = true) {
            const status = document.getElementById('syncStatus');
            status.textContent = message;
            status.className = isOk ? 'sync-status sync-ok' : 'sync-status';
        }

        // Load user data from Google Sheets
        async function loadUserData() {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?userId=${userEmail}`);
                const data = await response.json();
                
                foods = data.map(row => ({
                    userId: row[0],
                    date: row[1],
                    foodName: row[2],
                    totalCal: parseInt(row[3]) || 0,
                    totalProtein: parseFloat(row[4]) || 0,
                    time: row[5],
                    quantity: parseFloat(row[6]) || 1,
                    id: Math.random()
                }));
                
                updateSyncStatus('✅ ดึงข้อมูลสำเร็จ', true);
            } catch (error) {
                updateSyncStatus('⚠️ ไม่สามารถเชื่อมต่อ Google Sheets', false);
                console.error('Error loading data:', error);
            }
        }

        // Save food to Google Sheets
        async function saveFoodToSheet(food) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        userId: userEmail,
                        date: food.date,
                        foodName: food.foodName,
                        calories: food.totalCal,
                        protein: food.totalProtein,
                        time: food.time,
                        quantity: food.quantity
                    })
                });
                updateSyncStatus('✅ บันทึกข้อมูลสำเร็จ', true);
            } catch (error) {
                updateSyncStatus('⚠️ ไม่สามารถบันทึกข้อมูล', false);
                console.error('Error saving data:', error);
            }
        }

        function init() {
            updateDisplay();
            updateDate();
        }

        function updateDate() {
            const date = new Date(currentDate + 'T00:00:00');
            const formatted = date.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('currentDate').textContent = formatted;
        }

        function changeDate(days) {
            const date = new Date(currentDate + 'T00:00:00');
            date.setDate(date.getDate() + days);
            currentDate = date.toISOString().split('T')[0];
            updateDate();
            updateDisplay();
        }

        function goToday() {
            currentDate = new Date().toISOString().split('T')[0];
            updateDate();
            updateDisplay();
        }

        function filterFoods() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('foodList');
            const panel = document.getElementById('servingSizePanel');
            
            if (!search) {
                list.innerHTML = '';
                panel.classList.add('hidden');
                return;
            }

            const filtered = foodDatabase.filter(f => f.name.toLowerCase().includes(search));
            list.innerHTML = filtered.slice(0, 8).map(f => `
                <div class="food-item" onclick="selectFood('${f.name}')">
                    <div class="food-name">${f.name}</div>
                    <div class="food-info">${f.cal} cal | ${f.protein}g โปรตีน / ${f.unit}</div>
                </div>
            `).join('');

            if (search) panel.classList.remove('hidden');
        }

        function selectFood(name) {
            selectedFood = foodDatabase.find(f => f.name === name);
            document.getElementById('searchInput').value = name;
            document.getElementById('servingSize').value = 1;
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('mealTime').value = `${hours}:${minutes}`;
            document.getElementById('foodList').innerHTML = '';
        }

        function addFoodToToday() {
            if (!selectedFood) return;
            
            const qty = parseFloat(document.getElementById('servingSize').value);
            const mealTime = document.getElementById('mealTime').value || new Date().toTimeString().slice(0, 5);
            const food = {
                userId: userEmail,
                date: currentDate,
                foodName: selectedFood.name,
                quantity: qty,
                totalCal: Math.round(selectedFood.cal * qty),
                totalProtein: Math.round(selectedFood.protein * qty * 10) / 10,
                time: mealTime,
                id: Date.now()
            };

            foods.push(food);
            saveFoodToSheet(food);
            updateDisplay();
            document.getElementById('searchInput').value = '';
            document.getElementById('mealTime').value = '';
            document.getElementById('servingSizePanel').classList.add('hidden');
            selectedFood = null;
        }

        function removeFood(id) {
            foods = foods.filter(f => f.id !== id);
            updateDisplay();
        }

        async function handleImageUpload() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                try {
                    const res = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-6',
                            max_tokens: 500,
                            messages: [{
                                role: 'user',
                                content: [
                                    { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
                                    { type: 'text', text: 'บอกเฉพาะชื่ออาหารในภาพเป็นภาษาไทย 1 บรรทัด' }
                                ]
                            }]
                        })
                    });

                    const data = await res.json();
                    const foodName = data.content?.[0]?.text || '';
                    const matched = foodDatabase.find(f => f.name.toLowerCase().includes(foodName.toLowerCase()));
                    
                    if (matched) {
                        selectedFood = matched;
                        document.getElementById('searchInput').value = matched.name;
                        document.getElementById('servingSize').value = 1;
                        document.getElementById('servingSizePanel').classList.remove('hidden');
                    } else {
                        alert(`ไม่พบ "${foodName}" ในฐานข้อมูล`);
                    }
                } catch (error) {
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                }
            };
            reader.readAsDataURL(file);
        }

        function saveProteinGoal() {
            updateDisplay();
        }

        function updateDisplay() {
            let todayFoods = foods.filter(f => f.date === currentDate);
            todayFoods.sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));
            const totalCal = todayFoods.reduce((sum, f) => sum + f.totalCal, 0);
            const totalProtein = todayFoods.reduce((sum, f) => sum + f.totalProtein, 0);
            const goal = parseInt(document.getElementById('proteinGoal').value);
            const percent = Math.min(100, Math.round((totalProtein / goal) * 100));

            document.getElementById('totalCal').textContent = totalCal;
            document.getElementById('totalProtein').textContent = totalProtein;
            document.getElementById('proteinGoalDisplay').textContent = goal;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').textContent = 
                totalProtein >= goal ? '✅ ครบเป้าหมาย!' : `ยังขาด ${Math.max(0, goal - totalProtein).toFixed(1)}g โปรตีน`;

            const logList = document.getElementById('foodLogList');
            const logPanel = document.getElementById('foodLogPanel');
            const emptyState = document.getElementById('emptyState');

            if (todayFoods.length > 0) {
                logPanel.classList.remove('hidden');
                emptyState.classList.add('hidden');
                logList.innerHTML = todayFoods.map(f => `
                    <div class="log-item">
                        <div>
                            <div class="log-name">${f.foodName}</div>
                            <div class="log-qty">${f.quantity}${foodDatabase.find(x => x.name === f.foodName)?.unit || ''} <span style="color: #ff69b4; font-weight: 500;">🕐 ${f.time}</span></div>
                            <div class="log-nutrition">${f.totalCal} cal | ${f.totalProtein}g protein</div>
                        </div>
                        <button class="btn-delete" onclick="removeFood(${f.id})">ลบ</button>
                    </div>
                `).join('');
            } else {
                logPanel.classList.add('hidden');
                emptyState.classList.remove('hidden');
            }

            updateStats();
        }

        function toggleStats() {
            document.getElementById('statsPanel').classList.toggle('hidden');
        }

        function updateStats() {
            if (foods.length === 0) return;

            const dates = [...new Set(foods.map(f => f.date))];
            const dailyStats = {};
            
            foods.forEach(f => {
                if (!dailyStats[f.date]) dailyStats[f.date] = { cal: 0, protein: 0 };
                dailyStats[f.date].cal += f.totalCal;
                dailyStats[f.date].protein += f.totalProtein;
            });

            const totalCal = Object.values(dailyStats).reduce((sum, d) => sum + d.cal, 0);
            const totalProtein = Object.values(dailyStats).reduce((sum, d) => sum + d.protein, 0);

            document.getElementById('totalDays').textContent = dates.length;
            document.getElementById('avgProtein').textContent = (Math.round((totalProtein / dates.length) * 10) / 10) + 'g';
            document.getElementById('avgCalories').textContent = Math.round(totalCal / dates.length) + ' cal';
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(foods, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `calorie-tracker-${currentDate}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAllData() {
            if (confirm('แน่ใจหรือ? การลบข้อมูลไม่สามารถกู้คืนได้')) {
                foods = [];
                updateDisplay();
                updateStats();
            }
        }
    </script>
</body>
</html>
